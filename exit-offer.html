<title>Wacht Even</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap">

<style>
  /* Layout: single full-screen centered column, dark gaming vibe */
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: rgba(255,255,255,0.08);
    --fg: #ffffff;
    --fg-muted: rgba(255,255,255,0.55);
    --gold: #f5c842;
    --gold-glow: rgba(245,200,66,0.25);
    --green: #00e676;
    --green-glow: rgba(0,230,118,0.2);
    --red: #ff4444;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-block: max(env(safe-area-inset-top,0px) + 32px, 32px) max(env(safe-area-inset-bottom,0px) + 32px, 32px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }

  /* animated background grid */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(245,200,66,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,200,66,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* top alert strip */
  .alert-strip {
    background: var(--red);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 6px 6px 0 0;
    width: 100%;
    text-align: center;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 20px 20px;
    padding: 32px 28px 36px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    box-shadow:
      0 0 60px rgba(245,200,66,0.08),
      0 20px 60px rgba(0,0,0,0.6);
  }

  /* game icon area */
  .game-badge {
    position: relative;
    width: 88px;
    height: 88px;
    border-radius: 22px;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 2px solid var(--gold);
    box-shadow: 0 0 24px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .game-badge canvas {
    border-radius: 12px;
  }

  .headline-block {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(44px, 11vw, 64px);
    line-height: 0.95;
    letter-spacing: 0.02em;
    color: var(--fg);
    text-wrap: balance;
  }

  .headline span {
    color: var(--gold);
    text-shadow: 0 0 30px var(--gold-glow);
  }

  .subline {
    font-size: 15px;
    color: var(--fg-muted);
    line-height: 1.5;
    text-wrap: balance;
    max-width: 340px;
  }

  /* earning stat */
  .stat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,230,118,0.07);
    border: 1px solid rgba(0,230,118,0.2);
    border-radius: 12px;
    padding: 16px 20px;
    width: 100%;
  }

  .stat-icon {
    width: 40px;
    height: 40px;
    background: rgba(0,230,118,0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .stat-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 900;
    color: var(--green);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px var(--green-glow);
    line-height: 1;
  }

  .stat-label {
    font-size: 12px;
    color: var(--fg-muted);
    font-weight: 600;
  }

  /* social proof */
  .proof-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--fg-muted);
  }

  .proof-dots {
    display: flex;
    gap: -4px;
  }

  .proof-dots span {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--bg);
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: inline-block;
    margin-right: -6px;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  /* CTA button */
  .cta-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: linear-gradient(135deg, #f5c842, #f0a500);
    color: #0a0a0f;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.02em;
    padding: 18px 24px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 24px rgba(245,200,66,0.35), 0 1px 0 rgba(255,255,255,0.2) inset;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(245,200,66,0.45), 0 1px 0 rgba(255,255,255,0.2) inset;
  }

  .cta-btn:active {
    transform: translateY(0);
  }

  .cta-arrow {
    font-size: 20px;
    transition: transform 0.15s ease;
  }

  .cta-btn:hover .cta-arrow {
    transform: translateX(3px);
  }

  /* dismiss link */
  .dismiss {
    font-size: 12px;
    color: var(--fg-muted);
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
    opacity: 0.7;
    transition: opacity 0.15s;
    font-family: inherit;
  }

  .dismiss:hover { opacity: 1; }

  /* pulse animation on the stat */
  @keyframes pulse-green {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,230,118,0.3); }
    50% { box-shadow: 0 0 0 8px rgba(0,230,118,0); }
  }

  .stat-icon { animation: pulse-green 2.5s ease infinite; }

  @media (prefers-reduced-motion: reduce) {
    .stat-icon { animation: none; }
    .cta-btn { transition: none; }
  }
</style>

<div class="wrapper">
  <div class="alert-strip">⚠ Wacht — Exclusief Aanbod</div>
  <div class="card">

    <div class="game-badge">
      <canvas id="blockCanvas" width="60" height="60"></canvas>
    </div>

    <div class="headline-block">
      <p class="eyebrow">Voordat je weggaat</p>
      <h1 class="headline">Verdien<br><span>500€</span><br>Per Uur</h1>
      <p class="subline">
        BlockBlast-spelers op Freecash verdienen echt geld — geen trucs, geen abonnement.
      </p>
    </div>

    <div class="stat-row">
      <div class="stat-icon">💸</div>
      <div class="stat-text">
        <span class="stat-value" id="counterVal">€0.00</span>
        <span class="stat-label">verdiend door spelers in de laatste 60s</span>
      </div>
    </div>

    <div class="proof-row">
      <div class="proof-dots">
        <span>A</span><span>M</span><span>R</span><span>K</span>
      </div>
      <span>+12.400 actieve spelers nu online</span>
    </div>

    <a class="cta-btn" href="javascript:history.back()" id="ctaBtn">
      Ja, ik wil verdienen
      <span class="cta-arrow">→</span>
    </a>

    <button class="dismiss" onclick="window.close(); history.back();">Nee, ik doe niet mee</button>

  </div>
</div>

<script>
// BlockBlast pixel art icon on canvas
(function() {
  const c = document.getElementById('blockCanvas');
  const ctx = c.getContext('2d');
  const colors = ['#f5c842','#00e676','#ff4444','#42a5f5','#ab47bc','#ff7043'];
  const grid = [
    [1,1,0,0,2,2],
    [1,1,0,0,2,2],
    [0,0,3,3,0,0],
    [0,0,3,3,0,0],
    [4,4,0,0,5,5],
    [4,4,0,0,5,5],
  ];
  const size = 10;
  grid.forEach((row, r) => {
    row.forEach((cell, col) => {
      if (!cell) return;
      ctx.fillStyle = colors[cell - 1];
      ctx.beginPath();
      ctx.roundRect(col * size, r * size, size - 1, size - 1, 2);
      ctx.fill();
    });
  });
})();

// live counter animation
(function() {
  const el = document.getElementById('counterVal');
  let val = 847.30 + Math.random() * 200;
  function tick() {
    val += (Math.random() * 4.5 + 0.5);
    el.textContent = '€' + val.toFixed(2);
    setTimeout(tick, 800 + Math.random() * 600);
  }
  tick();
})();
</script>
